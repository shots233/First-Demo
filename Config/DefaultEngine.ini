# —— 光线追踪（2026-09-02 关闭）——
# 原因：锁定/镜头首帧引入 BOSS 时触发 RT 加速结构（BVH）构建，GPU 单帧 85ms，
# 帧率掉到 10 FPS 并持续数秒（与玩家锁定行为直接相关）。
# 当前光照 GI=SSGI / 反射=SSR，不用 RT 也有可用画面；开启时记得接受首帧卡顿
# 或先做"目标预热"。想恢复：两行都改回 True。
r.RayTracing=False

r.RayTracing.RayTracingProxies.ProjectEnabled=False

r.Shadow.Virtual.Enable=1

# —— 体积云（2026-09-02 关闭）——
# 原因：镜头抬起/锁定后 VolumetricCloud pass 平均 59ms、峰值 222ms（GPU 总时间约 108ms），
# 帧率掉到 9~10 FPS；stat gpu 确认元凶即 VolumetricCloud。
# 想保留云景：改回 1，并用降级配置压开销：
#   r.VolumetricCloud.Shadow.Enable=0
#   r.VolumetricCloud.ViewRayResolution=64
#   r.VolumetricCloud.ReflectionRayResolution=32
#   r.VolumetricCloud.HighQualityAerialPerspective=0
r.VolumetricCloud=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

